[build-system]
requires = ["setuptools==75.6.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "reservation-service"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3"
]

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "ruff==0.8.4",
  "mypy==1.13.0",
  "bandit==1.7.9",
  "detect-secrets==1.5.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "pre-commit==4.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
exclude = "^alembic/"

[tool.pytest.ini_options]
addopts = "-q -W error --strict-config --strict-markers --maxfail=1 --cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["."]

[tool.coverage.report]
fail_under = 80
show_missing = true