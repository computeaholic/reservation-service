name: ci

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project with dev tooling
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install .[dev]

      - name: Lint
        run: make lint

      - name: Test with coverage threshold
        run: make test