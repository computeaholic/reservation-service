name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install \
            black==24.10.0 \
            ruff==0.8.4 \
            mypy==1.13.0 \
            pytest==8.3.4 \
            pytest-cov==6.0.0

      - name: Format check
        run: black --check .

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy .

      - name: Test with coverage threshold
        run: pytest -q -W error --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.90.5
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --results=verified,unknown --fail --no-update