name: ci

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: reservation_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PYTHONWARNINGS: error
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/reservation_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project with dev tooling
        env:
          PYTHONWARNINGS: default
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install .[dev]

      - name: Lint
        run: make lint

      - name: Validate migrations
        run: DATABASE_URL=${DATABASE_URL} PYTHONPATH=src python -m pytest tests/test_migrations.py --no-cov

      - name: Test with coverage threshold
        run: make test